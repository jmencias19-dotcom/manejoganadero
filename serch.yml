name: Bot de Búsqueda Automática

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diagnóstico e Instalación
        run: |
          echo "=== 1. Verificando estructura de archivos ==="
          ls -la
          echo "=== 2. Instalando dependencias ==="
          npm install

      - name: Ejecutar el script Node
        env:
          BOT_TOKEN: ${{ secrets.JJM1 }}
        run: node index.js
