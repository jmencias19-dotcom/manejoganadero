<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores de Gestión - Hato Laguna Brava</title>
    <link rel="stylesheet" href="variables.css?v=1.1">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/potreros.css?v=3.0">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    
    <!-- Contenedor dinámico donde header.js inyectará el encabezado unificado -->
    <div id="app-header"></div>

    <!-- Contenedor principal de reportes -->
    <main class="main-container">
        <section class="section-box">
            <div class="grid-library">
                
                <article class="card">
                    <div class="card-header">
                        <div class="card-icon" id="estadisticas-icon" aria-hidden="true"> 
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="20" x2="18" y2="10"></line>
                                <line x1="12" y1="20" x2="12" y2="4"></line>
                                <line x1="6" y1="20" x2="6" y2="14"></line>
                            </svg>
                        </div>
                        <h2 class="card-title">Estadísticas Principales</h2>
                    </div>
                    <div class="card-content">
                        <p class="card-description">Visualización de datos clave sobre el rebaño, producción e inventario.</p>
                    </div>
                </article>

            </div>
        </section>
    </main>

    <!-- Scripts del Sistema y Módulos -->
    <script src="/js/header.js"></script>
    <script src="/js/syncManager.js"></script>
</body>
</html>
