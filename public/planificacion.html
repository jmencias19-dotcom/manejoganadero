<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planificación de Tareas - Hato Laguna Brava</title>
    <!-- Centralizado en tus Estilos Maestros Unificados -->
    <link rel="stylesheet" href="./potreros.css?v=4.0">
    
    <!-- SOLUCIÓN AL ERROR CORB: Reemplazada la URL rota de cloudflare por el CDN correcto de iconos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <link rel="manifest" href="manifest.json">
</head>

    <!-- CONTENEDOR PRINCIPAL Y REJILLA (Modelo de 2 Columnas de Trabajo Uniformes) -->
    <main class="main-container">
        <div class="menu-grid">
            
            <!-- COLUMNA 1: Formulario Técnico de Registro -->
            <section class="section-box" style="height: auto;">
                <div class="card-header">
                    <div class="card-icon">📋</div>
                    <h2 class="card-title">Registro de Nueva Labor</h2>
                </div>
                <p class="card-description">Asigne y configure los parámetros de las actividades ganaderas diarias.</p>
                
                <form id="taskForm">
                    <div class="input-group">
                        <label for="fecha">Fecha de Ejecución:</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="input-group">
                        <label for="labor">Labor a Realizar:</label>
                        <input type="text" id="labor" placeholder="Ej. Vacunación Brahman, mantenimiento de potrero..." required>
                    </div>

                    <!-- PRIMER ANEXO ASIMÉTRICO: Relación 46% Izquierda / 54% Derecha -->
                    <div class="kpi-container">
                        <div class="input-group">
                            <label for="prioridad-labor">Prioridad:</label>
                            <select id="prioridad-labor" required>
                                <option value="alta">🔴 Alta</option>
                                <option value="media" selected>Mandatorio / Media</option>
                                <option value="baja">🟢 Baja</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="personal">Personal / Vaquero Responsable:</label>
                            <input type="text" id="personal" placeholder="Nombre del operario" required>
                        </div>
                    </div>

                    <!-- SEGUNDO ANEXO ASIMÉTRICO: Relación 46% Izquierda / 54% Derecha -->
                    <div class="kpi-container">
                        <div class="input-group">
                            <label for="horario-labor">Horario:</label>
                            <select id="horario-labor" required>
                                <option value="manana" selected>🌅 Mañana</option>
                                <option value="tarde">☀️ Tarde</option>
                                <option value="todo-dia">📅 Todo el día</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="potrero-afectado">Potrero de Destino:</label>
                            <input type="text" id="potrero-afectado" placeholder="Ej. Macanillal, Las Rallas..." required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="observaciones">Observaciones / Notas de Campo:</label>
                        <textarea id="observaciones" placeholder="Detalles de potreros, insumos o instrucciones adicionales..." rows="3"></textarea>
                    </div>
                    
                    <div style="display: flex; gap: 10px; margin-top: 10px; width: 100%;">
                        <button type="submit" class="btn" style="flex: 1;">💾 Guardar Tarea</button>
                        <button type="button" id="btnRehacer" class="btn" style="background-color: var(--text-muted); width: auto;"><i class="fa-solid fa-rotate"></i></button>
                    </div>
                </form>
            </section>

            <!-- COLUMNA 2: Tareas Programadas y Lista de Control -->
            <section class="section-box" style="height: auto;">
                <div class="card-header">
                    <div class="card-icon">🤠</div>
                    <h2 class="card-title">Tareas Programadas</h2>
                </div>
                <p class="card-description">Labores vigentes y estados de progreso asignados en la sabana.</p>
                
                <!-- Indicadores Rápidos KPI para el módulo de tareas -->
                <div class="kpi-container" style="margin-bottom: 15px;">
                    <div class="kpi-card">
                        <div class="kpi-title">Pendientes</div>
