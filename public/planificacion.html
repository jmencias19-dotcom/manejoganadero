<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificación</title>
    <link rel="stylesheet" href="planificacion.css">
    <link rel="stylesheet" href="variables.css">
</head>
<body>

    <div class="planificacion-tareas-card">
        <h3>Planificación de Labores</h3>
        <form id="tarea-form" class="tarea-form-grid">
            
            <!-- Descripción de tareas -->
            <div class="tarea-field-group">
                <label for="tarea-desc">Descripción de Tareas:</label>
                <textarea id="tarea-desc" class="tarea-textarea" required></textarea>
            </div>

            <!-- Responsable -->
            <div class="tarea-field-group">
                <label for="tarea-responsable">Responsable:</label>
                <input type="text" id="tarea-responsable" class="tarea-input" required>
            </div>

            <!-- Observación -->
            <div class="tarea-field-group">
                <label for="tarea-observacion">Observación:</label>
                <textarea id="tarea-observacion" class="tarea-textarea"></textarea>
            </div>

            <!-- Fecha de asignación -->
            <div class="tarea-field-group">
                <label for="tarea-fecha">Fecha de Asignación:</label>
                <input type="date" id="tarea-fecha" class="tarea-input" required>
            </div>

            <!-- Controles: Guardar, Rehacer y Semáforo de Sincronización -->
            <div class="tarea-actions-group">
                <button type="submit" class="btn guardar">Guardar y Sincronizar</button>
                <button type="button" id="btn-rehacer" class="btn rehacer">Rehacer Tarea</button>
                <div id="sync-semaforo" class="semaforo-indicador" title="Estado de Sincronización"></div>
            </div>
        </form>

        <!-- Área de resumen de actividades y listado -->
        <div class="resumen-actividades">
            <h4>Resumen de Actividades</h4>
            <ul id="task-list"></ul>
        </div>
    </div>

</body>
</html>
