<div class="planificacion-tareas-card">
  <h3>Planificación de Labores</h3>
  <form id="tarea-form">
    <label for="tarea-labor">Labor:</label>
    <input type="text" id="tarea-labor" required>

    <label for="tarea-desc">Descripción:</label>
    <textarea id="tarea-desc" required></textarea>

    <label for="tarea-fecha">Fecha:</label>
    <input type="date" id="tarea-fecha" required>

    <button type="submit">Guardar Tarea</button>
  </form>
</div>
