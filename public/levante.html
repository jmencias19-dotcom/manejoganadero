<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hato Laguna Brava - Control de Levante</title>
    
    <!-- Centralizado en tus Estilos Maestros Unificados (v4.1) -->
    <link rel="stylesheet" href="./potreros.css?v=4.1">
    
    <!-- CDN oficial de iconos FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Manifiesto PWA -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* Estilos complementarios para la rejilla y el formulario adaptados a la v4.1 */
        body { 
            background-color: var(--bg-main, #f4f7f5); 
            color: var(--text-main, #1b4332); 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 0; 
        }

        .main-container { 
            padding: 24px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }

        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); 
            gap: 24px; 
        }

        .section-box {
            background-color: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #d8f3dc);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.03);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border-bottom: 2px solid var(--border-color, #d8f3dc); 
            padding-bottom: 12px; 
            margin: 0;
        }

        .card-title { 
            font-size: 1.3rem; 
            font-weight: 700;
            margin: 0; 
            color: var(--primary-color, #2d6a4f); 
        }

        .card-description {
            font-size: 0.9rem;
            color: #555;
            margin: 0;
        }

        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 6px;
        }

        .input-group label { 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: var(--primary-color, #2d6a4f);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select, .input-group textarea { 
            padding: 10px 14px; 
            border: 1px solid var(--border-color, #d8f3dc); 
            border-radius: 8px; 
            font-size: 0.95rem;
            background-color: #fafdfb;
            color: var(--text-main, #1b4332);
        }

        .kpi-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 14px; 
        }

        .kpi-card-item {
            background-color: #f7fdfa;
            border: 1px solid var(--border-color, #d8f3dc);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .kpi-card-item label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-color, #2d6a4f);
            margin: 0;
        }

        .kpi-value { 
            font-weight: 700; 
            font-size: 1.2rem;
            color: var(--text-main, #1b4332); 
        }

        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary-color, #2d6a4f); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            transition: background 0.2s;
        }

        .btn-submit:hover { 
            background: var(--secondary-color, #40916c); 
        }
    </style>
</head>
<body>

    <!-- Contenedor dinámico opcional para inyección por script -->
    <div id="app-header"></div>

    <!-- ENCABEZADO MAESTRO COMPATIBLE CON TU CSS -->
    <header class="main-header">
        <div class="header-container">
            <nav class="header-nav">
                <a href="./index.html" class="btn-back" style="text-decoration: none;">
                    <i class="fa-solid fa-arrow-left"></i> Volver al Panel
                </a>
            </nav>
            <div class="header-title-wrapper">
                <h1>Hato Laguna Brava - <span>Control de Levante</span></h1>
                <p>Evolución de Peso, Ganancia Diaria y Carga Estacional</p>
            </div>
            <!-- Semáforo de Sincronización -->
            <div class="sync-status-wrapper">
                <div id="sync-semaphore" class="semaphore online"></div>
                <span id="sync-text" class="sync-text">Sincronizado Local</span>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL Y REJILLA -->
    <main class="main-container">
        <div class="menu-grid">
            
            <!-- COLUMNA 1: FORMULARIO DE ENTRADA DE DATOS -->
            <section class="section-box">
                <div class="card-header">
                    <div class="card-icon" style="font-size: 1.4rem;">📋</div>
                    <h2 class="card-title">Nuevo Registro de Levante</h2>
                </div>
                <p class="card-description">Ingrese los datos del pesaje y control periódico evaluado en la sabana.</p>
                
                <form id="form-levante" onsubmit="event.preventDefault();" style="display: flex; flex-direction: column; gap: 14px;">
                    <div class="input-group">
                        <label for="inputLote">Lote / Potrero</label>
                        <input type="text" id="inputLote" value="Lote 1" required>
                    </div>

                    <div class="kpi-container">
                        <div class="input-group">
                            <label for="inputPesoInicial">Peso Inicial Lote (kg)</label>
                            <input type="number" id="inputPesoInicial" value="269" required>
                        </div>
                        <div class="input-group">
                            <label for="inputPesoMax">Peso Máximo (kg)</label>
                            <input type="number" id="inputPesoMax" value="300" required>
                        </div>
                    </div>

                    <div class="kpi-container">
                        <div class="input-group">
                            <label for="inputNumAnimales">Nº Animales / Lote</label>
                            <input type="number" id="inputNumAnimales" value="9" required>
                        </div>
                        <div class="input-group">
                            <label for="inputPesoMin">Peso Mínimo (kg)</label>
                            <input type="number" id="inputPesoMin" value="240" required>
                        </div>
                    </div>

                    <div class="kpi-container">
                        <div class="input-group">
                            <label for="selectEpoca">Época Climática</label>
                            <select id="selectEpoca" onchange="typeof actualizarSubetapa === 'function' && actualizarSubetapa()" required>
                                <option value="Invierno" selected>Invierno</option>
                                <option value="Verano">Verano</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="selectSubetapa">Ciclo Estacional</label>
                            <select id="selectSubetapa" required>
                                <option value="Invierno - Entrante" selected>Inicio (Entrante)</option>
                                <option value="Invierno - Mediados">Mediados</option>
                                <option value="Invierno - Finales">Finales</option>
                            </select>
                        </div>
                    </div>

                    <div class="kpi-container">
                        <div class="input-group">
                            <label for="inputFechaProx">Próximo Control</label>
                            <input type="date" id="inputFechaProx" value="2026-11-18" required>
                        </div>
                        <div class="input-group">
                            <label>Días Restantes</label>
                            <div id="displayDiasRestantes" class="kpi-value" style="padding: 10px 0; font-size: 1.15rem; color: var(--primary-color, #2d6a4f);">60 Días</div>
                        </div>
                    </div>

                    <div class="kpi-container">
                        <div class="input-group">
                            <label for="inputEdad">Edad Promedio (meses)</label>
                            <input type="number" step="0.1" id="inputEdad" value="8.5" required>
                        </div>
                        <div class="input-group">
                            <label for="inputPesoEsperado">Peso Esperado Salida</label>
                            <input type="number" id="inputPesoEsperado" value="350" required>
                        </div>
                    </div>

                    <div class="kpi-container">
                        <div class="input-group">
                            <label for="inputTiempoSalida">Tiempo Salida (meses)</label>
                            <input type="number" step="0.1" id="inputTiempoSalida" value="3.0" required>
                        </div>
