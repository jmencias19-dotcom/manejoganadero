<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Potreros - Hato Laguna Brava</title>
    <link rel="manifest" href="manifest.json">
    <!-- Enlace a tus estilos CSS -->
    <link rel="stylesheet" href="potreros.css">
</head>
<body>

    <!-- Encabezado -->
    <header class="main-header">
        <div class="header-container">
            <div class="header-title-wrapper">
                <h1>Hato Laguna Brava - <span>Gestión de Potreros</span></h1>
                <p>Módulo de Control de Capacidad de Carga y UGM</p>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal (Rejilla Responsiva) -->
    <main class="main-container">
        
        <!-- Bloque Izquierdo: Formulario de Registro -->
        <section class="section-box">
            <h2 class="section-title">Registrar Nuevo Potrero</h2>
            <form id="form-mod1">
                <div class="input-group">
                    <label for="nombre-potrero">Nombre del Potrero</label>
                    <input type="text" id="nombre-potrero" class="form-control" placeholder="Ej: Las Matas, El Caño" required>
                </div>
                
                <div class="input-group" style="margin-top: 12px;">
                    <label for="superficie-potrero">Superficie (Hectáreas)</label>
                    <input type="number" id="superficie-potrero" class="form-control" placeholder="Ej: 45" min="1" required>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-action">💾 Guardar Potrero</button>
                </div>
            </form>
        </section>

        <!-- Bloque Derecho: Inventario y Tarjetas -->
        <section class="section-box">
            <h2 class="section-title">Inventario de Potreros</h2>
            
            <!-- Tablero de Indicadores Rápidos -->
            <div class="kpi-container">
                <div class="kpi-card">
                    <div class="kpi-title">Total Potreros</div>
                    <div id="kpi-total-potreros" class="kpi-value">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-title">Total Hectáreas</div>
                    <div id="kpi-total-ha" class="kpi-value">0 Ha</div>
                </div>
            </div>

            <!-- Contenedor Dinámico -->
            <div class="potreros-container">
                <!-- Aquí el archivo JavaScript dibujará las tarjetas -->
            </div>
        </section>

    </main>

    <!-- Enlace a tu lógica JavaScript -->
    <script src="potreros.js"></script>
</body>
</html>
