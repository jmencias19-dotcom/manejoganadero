<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Eventos - Hato Laguna Brava</title>
    <link rel="stylesheet" href="./variables.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <h1>Gestión Ganadera Hato Laguna Brava</h1>
            <p>Módulo de Historial de Eventos Sanitarios</p>
        </div>
    </header>

    <main class="main-container">
        <div class="card">
            <h2>Historial de Tratamientos Registrados</h2>
            <p>A continuación se visualizan los registros sanitarios aplicados en el rebaño.</p>
            
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Arete</th>
                            <th>Tratamiento</th>
                            <th>Producto</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-eventos-body">
                        <!-- Los datos se cargarán dinámicamente desde el almacenamiento local -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="navigation-actions">
            <a href="./inventario-sanitario.html" class="btn-secondary">Registrar Nuevo Tratamiento</a>
            <a href="./index.html" class="btn-secondary">Volver al Inicio</a>
        </div>
    </main>

    <script src="./eventos.js"></script>
</body>
</html>
