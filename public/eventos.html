<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Eventos - Hato Laguna Brava</title>
    <link rel="stylesheet" href="./potreros.css?v=4.0">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- Contenedor donde se inyectará automáticamente el encabezado unificado (header.js) -->
    <div id="app-header"></div>

    <main class="main-container">
        <div class="section-box">
            <div class="section-title">Historial de Tratamientos Registrados</div>
            <p>A continuación se visualizan los registros sanitarios aplicados en el rebaño.</p>
            
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Arete</th>
                            <th>Tratamiento</th>
                            <th>Producto</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-eventos-body">
                        <!-- Los datos se cargarán dinámicamente desde el almacenamiento local -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="navigation-actions">
            <a href="./inventario-sanitario.html" class="btn-secondary">Registrar Nuevo Tratamiento</a>
            <a href="./index.html" class="btn-secondary">Volver al Inicio</a>
        </div>
    </main>

    <!-- Scripts del Sistema y Módulo -->
    <script src="/js/header.js"></script>
    <script src="/js/syncManager.js"></script>
    <script src="./eventos.js"></script>
</body>
</html>
