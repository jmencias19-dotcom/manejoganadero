<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificación de Tareas - Hato Laguna Brava</title>
    
    <link rel="stylesheet" href="variables.css?v=1.1">
    <link rel="stylesheet" href="planificacion.css?v=1.1">

    <style>
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-back {
            background-color: var(--card-bg);
            color: var(--primary-color);
            padding: 10px 18px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 600;
            border: 1px solid var(--border-color);
            box-shadow: var(--relief-shadow);
            transition: var(--transition);
        }

        .btn-back:hover {
            transform: translateY(-2px);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: var(--font-size-base);
            font-weight: 600;
            color: var(--primary-color);
        }

        .form-control {
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: var(--font-size-base);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            grid-column: 1 / -1;
            margin-top: 10px;
            padding: 12px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--relief-shadow);
            transition: var(--transition);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: var(--font-size-base);
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-weight: 700;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
        }

        .status-pendiente { background-color: #fff3cd; color: #856404; }
        .status-proceso { background-color: #cce5ff; color: #004085; }
        .status-completada { background-color: #d4edda; color: #155724; }

        .btn-delete {
            background-color: #dc3545;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <div>
                <h1 style="color: var(--primary-color);">Hato Laguna Brava</h1>
                <p style="color: var(--text-muted);">Módulo de Planificación de Tareas Operativas</p>
            </div>
            <a href="index.html" class="btn-back">← Volver al Panel</a>
        </div>

        <!-- Formulario de Registro -->
        <section class="card" style="margin-bottom: 30px;">
            <div class="card-header">
                <h3 class="card-title">Programar Nueva Labor</h3>
            </div>
            
            <form id="taskForm" class="form-grid">
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="labor">Labor / Actividad</label>
                    <select id="labor" class="form-control" required>
                        <option value="">Seleccione...</option>
                        <option value="Mantenimiento de Cercas">Mantenimiento de Cercas</option>
                        <option value="Roza y Callejones">Roza y Callejones</option>
                        <option value="Limpieza de Bebederos">Limpieza de Bebederos</option>
                        <option value="Faenas de Corral / Pesaje">Faenas de Corral / Pesaje</option>
                        <option value="Suministro de Sal / Minerales">Suministro de Sal / Minerales</option>
                        <option value="Control Sanitario / Vacunación">Control Sanitario / Vacunación</option>
                        <option value="Otra Labor">Otra Labor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ubicacion">Potrero / Sector</label>
                    <input type="text" id="ubicacion" class="form-control" placeholder="Ej: Potrero El Sabanón" required>
                </div>

                <div class="form-group">
                    <label for="personal">Encargado / Cuadrilla</label>
                    <input type="text" id="personal" class="form-control" placeholder="Nombre del personal" required>
                </div>

                <div class="form-group">
                    <label for="estado">Estado Inicial</label>
                    <select id="estado" class="form-control">
                        <option value="Pendiente">Pendiente</option>
                        <option value="En Proceso">En Proceso</option>
                        <option value="Completada">Completada</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Registrar Tarea</button>
            </form>
        </section>

        <!-- Tabla de Control -->
        <section class="card">
            <div class="card-header">
                <h3 class="card-title">Programación de Campo Registrada</h3>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Labor</th>
                            <th>Ubicación</th>
                            <th>Personal</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                        <!-- Las tareas cargadas aparecerán aquí -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskForm = document.getElementById('taskForm');
            const taskTableBody = document.getElementById('taskTableBody');

            // Cargar tareas guardadas
            let tasks = JSON.parse(localStorage.getItem('hato_tareas')) || [];

            function renderTasks() {
                taskTableBody.innerHTML = '';
                if (tasks.length === 0) {
                    taskTableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">No hay tareas programadas.</td></tr>`;
                    return;
                }

                tasks.forEach((task, index) => {
                    const tr = document.createElement('tr');
                    
                    let badgeClass = 'status-pendiente';
                    if (task.estado === 'En Proceso') badgeClass = 'status-proceso';
                    if (task.estado === 'Completada') badgeClass = 'status-completada';

                    tr.innerHTML = `
                        <td>${task.fecha}</td>
                        <td><strong>${task.labor}</strong></td>
                        <td>${task.ubicacion}</td>
                        <td>${task.personal}</td>
                        <td><span class="badge ${badgeClass}">${task.estado}</span></td>
                        <td><button class="btn-delete" onclick="deleteTask(${index})">Eliminar</button></td>
                    `;
                    taskTableBody.appendChild(tr);
                });
            }

            taskForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const newTask = {
                    fecha: document.getElementById('fecha').value,
                    labor: document.getElementById('labor').value,
                    ubicacion: document.getElementById('ubicacion').value,
                    personal: document.getElementById('personal').value,
                    estado: document.getElementById('estado').value
                };

                tasks.push(newTask);
                localStorage.setItem('hato_tareas', JSON.stringify(tasks));
                taskForm.reset();
                renderTasks();
            });

            window.deleteTask = (index) => {
                tasks.splice(index, 1);
                localStorage.setItem('hato_tareas', JSON.stringify(tasks));
                renderTasks();
            };

            renderTasks();
        });
    </script>
</body>
</html>
