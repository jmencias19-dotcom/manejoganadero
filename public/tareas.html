<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        initializeFirestore, 
        collection, 
        addDoc, 
        updateDoc, 
        deleteDoc, 
        doc, 
        onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración del proyecto Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBnIB0rPQULTOfs55YSnsX2C-2rN5pTANk",
        authDomain: "hato-laguna-brava.firebaseapp.com",
        projectId: "hato-laguna-brava",
        storageBucket: "hato-laguna-brava.firebasestorage.app",
        messagingSenderId: "1053099733476",
        appId: "1:1053099733476:web:541a115776b2e80047d7f1",
        measurementId: "G-RSW0XSHF1F"
    };

    // Inicialización del servicio forzando Long-Polling (evita bloqueos QUIC / HTTP3)
    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
        experimentalForceLongPolling: true,
    });
    const tasksCollection = collection(db, "tareas");

    // Referencias a elementos del DOM
    const taskForm = document.getElementById('taskForm');
    const taskTableBody = document.getElementById('taskTableBody');
    const light = document.getElementById('light');
    const statusText = document.getElementById('statusText');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');

    // Auxiliar para sanitización de cadenas (Previene inyección de código/XSS)
    const escapeHtml = (str) => String(str || '').replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[match]);

    // Gestión del indicador visual de sincronización
    function setSyncStatus(isSyncing, isError = false) {
        if (!light || !statusText) return;
        if (isError) {
            light.classList.remove('syncing');
            statusText.textContent = 'Error de Conexión';
            return;
        }
        if (isSyncing) {
            light.classList.add('syncing');
            statusText.textContent = 'Sincronizando...';
        } else {
            light.classList.remove('syncing');
            statusText.textContent = 'Conectado a la Nube';
        }
    }

    // Notificaciones Toast emergentes
    function showNotification(message, type = 'success') {
        if (!toast || !toastMessage) return;
        toastMessage.textContent = message;
        toast.className = `toast-notification ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function getStatusClass(status) {
        if (status === 'En Proceso') return 'status-proceso';
        if (status === 'Completada') return 'status-completada';
        return 'status-pendiente';
    }

    // 1. Escuchar cambios en tiempo real (Sincronización bidireccional)
    setSyncStatus(true);
    onSnapshot(tasksCollection, (snapshot) => {
        if (!taskTableBody) return;
        taskTableBody.innerHTML = '';
        
        if (snapshot.empty) {
            taskTableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">No hay labores registradas en el servidor.</td></tr>`;
            setSyncStatus(false);
            return;
        }

        snapshot.forEach((docSnapshot) => {
            const task = docSnapshot.data();
            const id = docSnapshot.id;
            const tr = document.createElement('tr');
            const statusClass = getStatusClass(task.estado);

            tr.innerHTML = `
                <td>${escapeHtml(task.fecha)}</td>
                <td><strong>${escapeHtml(task.labor)}</strong></td>
                <td>${escapeHtml(task.personal)}</td>
                <td>${escapeHtml(task.observaciones || '-')}</td>
                <td>
                    <select class="status-select ${statusClass}" onchange="window.updateTaskStatus('${id}', this.value)">
                        <option value="Pendiente" ${task.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                        <option value="En Proceso" ${task.estado === 'En Proceso' ? 'selected' : ''}>En Proceso</option>
                        <option value="Completada" ${task.estado === 'Completada' ? 'selected' : ''}>Completada</option>
                    </select>
                </td>
                <td><button class="btn-delete" onclick="window.deleteTask('${id}')">Eliminar</button></td>
            `;
            taskTableBody.appendChild(tr);
        });
        setSyncStatus(false);
    }, (error) => {
        console.error("Error en lectura remota de Firestore:", error);
        setSyncStatus(false, true);
    });

    // 2. Registro de nueva labor desde el formulario
    if (taskForm) {
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            setSyncStatus(true);
            try {
                await addDoc(tasksCollection, {
                    fecha: document.getElementById('fecha').value,
                    labor: document.getElementById('labor').value,
                    personal: document.getElementById('personal').value,
                    observaciones: document.getElementById('observaciones').value,
                    estado: 'Pendiente',
                    creadoEn: new Date().toISOString()
                });
                taskForm.reset();
                showNotification('Labor registrada exitosamente', 'success');
            } catch (err) {
                console.error("Error al escribir en Firestore:", err);
                showNotification('Error al guardar datos', 'danger');
            } finally {
                setSyncStatus(false);
            }
        });
    }

    // 3. Métodos CRUD expuestos al objeto global (window)
    window.updateTaskStatus = async (id, newStatus) => {
        setSyncStatus(true);
        try {
            await updateDoc(doc(db, "tareas", id), { estado: newStatus });
            showNotification(`Estado actualizado a "${newStatus}"`, 'warning');
        } catch (err) {
            console.error("Error al actualizar:", err);
            showNotification('Error al actualizar estado', 'danger');
        } finally {
            setSyncStatus(false);
        }
    };

    window.deleteTask = async (id) => {
        if (confirm('¿Deseas eliminar esta labor de la base de datos?')) {
            setSyncStatus(true);
            try {
                await deleteDoc(doc(db, "tareas", id));
                showNotification('Labor eliminada', 'danger');
            } catch (err) {
                console.error("Error al eliminar:", err);
                showNotification('Error al eliminar', 'danger');
            } finally {
                setSyncStatus(false);
            }
        }
    };
</script>
