<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        updateDoc, 
        deleteDoc, 
        doc, 
        onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
        getAuth, 
        signOut, 
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Capturador global de errores
    window.addEventListener('unhandledrejection', event => {
        console.error('Error no capturado:', event.reason);
    });

    const firebaseConfig = {
        apiKey: "AIzaSyBnIB0rPQULTOfs55YSnsX2C-2rN5pTANk",
        authDomain: "hato-laguna-brava.firebaseapp.com",
        projectId: "hato-laguna-brava",
        storageBucket: "hato-laguna-brava.firebasestorage.app",
        messagingSenderId: "1053099733476",
        appId: "1:1053099733476:web:541a115776b2e80047d7f1",
        measurementId: "G-RSW0XSHF1F"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const tasksCollection = collection(db, "tareas");

    const taskForm = document.getElementById('taskForm');
    const taskTableBody = document.getElementById('taskTableBody');
    const light = document.getElementById('light');
    const statusText = document.getElementById('statusText');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');

    let unsubscribeFirestore = null;

    // Funciones auxiliares de UI
    function setSyncStatus(isSyncing) {
        if (light && statusText) {
            if (isSyncing) {
                light.classList.add('syncing');
                statusText.textContent = 'Sincronizando...';
            } else {
                light.classList.remove('syncing');
                statusText.textContent = 'Conectado a la Nube';
            }
        }
    }

    function showNotification(message, type = 'success') {
        if (!toast || !toastMessage) return;
        toastMessage.textContent = message;
        toast.className = `toast-notification ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function getStatusClass(status) {
        if (status === 'En Proceso') return 'status-proceso';
        if (status === 'Completada') return 'status-completada';
        return 'status-pendiente';
    }

    // Control de sesión
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log("Usuario autenticado:", user.email);
            iniciarEscuchaTareas();
        } else {
            console.warn("Sesión no detectada.");
            if (unsubscribeFirestore) unsubscribeFirestore();
            if (statusText) statusText.textContent = "Sin Autenticar";
        }
    });

    function iniciarEscuchaTareas() {
        unsubscribeFirestore = onSnapshot(tasksCollection, (snapshot) => {
            if (!taskTableBody) return;
            taskTableBody.innerHTML = '';
            
            if (snapshot.empty) {
                taskTableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">No hay labores registradas.</td></tr>`;
                setSyncStatus(false);
                return;
            }

            snapshot.forEach((docSnapshot) => {
                const task = docSnapshot.data();
                const id = docSnapshot.id;
                const tr = document.createElement('tr');
                const statusClass = getStatusClass(task.estado);

                tr.innerHTML = `
                    <td>${task.fecha || ''}</td>
                    <td><strong>${task.labor || ''}</strong></td>
                    <td>${task.personal || ''}</td>
                    <td>${task.observaciones || '-'}</td>
                    <td>
                        <select class="status-select ${statusClass}" onchange="window.updateTaskStatus('${id}', this.value)">
                            <option value="Pendiente" ${task.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                            <option value="En Proceso" ${task.estado === 'En Proceso' ? 'selected' : ''}>En Proceso</option>
                            <option value="Completada" ${task.estado === 'Completada' ? 'selected' : ''}>Completada</option>
                        </select>
                    </td>
                    <td><button class="btn-delete" onclick="window.deleteTask('${id}')">Eliminar</button></td>
                `;
                taskTableBody.appendChild(tr);
            });
            setSyncStatus(false);
        }, (error) => {
            console.error("Error en onSnapshot de Firestore:", error);
            if (statusText) statusText.textContent = "Error de Permisos";
            setSyncStatus(false);
        });
    }

    // Registro de nuevas labores
    if (taskForm) {
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            setSyncStatus(true);
            try {
                await addDoc(tasksCollection, {
                    fecha: document.getElementById('fecha').value,
                    labor: document.getElementById('labor').value,
                    personal: document.getElementById('personal').value,
                    observaciones: document.getElementById('observaciones').value,
                    estado: 'Pendiente',
                    creadoEn: new Date().toISOString()
                });
                taskForm.reset();
                showNotification('Labor registrada exitosamente', 'success');
            } catch (err) {
                console.error("Error al guardar en Firestore:", err);
                showNotification('Error al guardar datos', 'danger');
            } finally {
                setSyncStatus(false);
            }
        });
    }

    // Métodos expuestos al alcance global (window)
    window.updateTaskStatus = async (id, newStatus) => {
        setSyncStatus(true);
        try {
            await updateDoc(doc(db, "tareas", id), { estado: newStatus });
            showNotification(`Estado actualizado a "${newStatus}"`, 'warning');
        } catch (err) {
            console.error("Error al actualizar:", err);
            showNotification('Error al actualizar estado', 'danger');
        } finally {
            setSyncStatus(false);
        }
    };

    window.deleteTask = async (id) => {
        if (confirm('¿Deseas eliminar esta labor de la base de datos?')) {
            setSyncStatus(true);
            try {
                await deleteDoc(doc(db, "tareas", id));
                showNotification('Labor eliminada', 'danger');
            } catch (err) {
                console.error("Error al eliminar:", err);
                showNotification('Error al eliminar', 'danger');
            } finally {
                setSyncStatus(false);
            }
        }
    };

    window.logout = async () => {
        try {
            await signOut(auth);
            window.location.href = "login.html";
        } catch (err) {
            console.error("Error al cerrar sesión:", err);
        }
    };
</script>
