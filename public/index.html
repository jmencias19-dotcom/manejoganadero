<script type="module">
  // 1. Captura avanzada de rechazos asíncronos
  window.addEventListener('unhandledrejection', (event) => {
    console.group(' [Unhandled Promise Rejection Detected]');
    console.error('Razón del rechazo:', event.reason);
    if (event.reason instanceof Error) {
      console.error('Mensaje:', event.reason.message);
      console.error('Stack:', event.reason.stack);
    }
    console.groupEnd();
    event.preventDefault();
  });

  // 2. Carga dinámica y segura del módulo db.js
  document.addEventListener('DOMContentLoaded', async () => {
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    try {
      // Ajusta la ruta ('./db.js' o './js/db.js') según la estructura de carpetas de tu servidor
      const { inicializarBaseDatos } = await import('./db.js');
      const exito = await inicializarBaseDatos();
      if (exito) {
        console.log(" Base de Datos IndexedDB/Dexie conectada correctamente.");
      }
    } catch (err) {
      console.error(" No se pudo cargar el archivo db.js (Verifica la ruta en el servidor):", err);
    }
  });
</script>
