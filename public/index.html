<body>

    <header class="main-header">
        <div class="header-container">

            <div class="flag-container" aria-label="Bandera de Venezuela">

                    <rect width="900" height="600" fill="#cf142b"/>
                    <rect width="900" height="400" fill="#00247d"/>

                    </g>
                </svg>
            </div>
     
            <!-- Título Central con Siluetas de Ganado -->
            <div class="header-title-wrapper">
                <div class="animal-silhouettes-top">
                    <!-- Silueta Vaca Cebú/Brahman -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="animal-icon" fill="currentColor" aria-hidden="true">
                        <path d="M4 8h2V6h2v2h8V6h2v2h2v4h-1v6h-2v-2H7v2H5v-6H4V8zm3 2v2h10v-2H7z"/>

                    <!-- Silueta Búfalo de Agua -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="animal-icon" fill="currentColor" aria-hidden="true">
                        <path d="M2 10c0-2 2-4 5-4h1V5h2v1h6V5h2v1h1c3 0 5 2 5 4v3h-2v4h-2v-2H6v2H4v-4H2v-3zm5-2c-1.1 0-2 .9-2 2v1h2V8h-2zm10 0v3h2V9c0-1.1-.9-2-2-2z"/>
                    </svg>
                </div>
                <h1>Gestión Ganadera Hato Laguna Brava
                    <br><span style="font-size: 0.75em; font-weight: 600;">Grupo Imperatori</span>
                </h1>
                <p>Panel de Control Directo - Operaciones de Campo</p>
            </div>

            <!-- Bandera de Italia (SVG) -->
            <div class="flag-container" aria-label="Bandera de Italia">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" class="flag-icon">
                    <rect width="900" height="600" fill="#cd212a"/>

                    <rect width="300" height="600" fill="#009246"/>

            </div>
        </div>

    <main class="dashboard-grid">
        
<article class="card card-tareas">
