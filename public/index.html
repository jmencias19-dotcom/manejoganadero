<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planificación de Tareas - Hato Laguna Brava</title>
    
    <link rel="stylesheet" href="variables.css?v=1.1">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color, #f4f6f8);
            color: var(--text-main, #1a1a1a);
            line-height: 1.4;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .card-form {
            background-color: var(--card-bg, #ffffff);
            border-radius: var(--radius-lg, 12px);
            padding: 16px;
            border: 1px solid var(--border-color, #e0e0e0);
            box-shadow: var(--relief-shadow, 0 4px 6px rgba(0,0,0,0.05));
            margin-bottom: 20px;
        }

        .card-form h2 {
            color: var(--primary-color, #1b4332);
            font-size: 1.25rem;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main, #333333);
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--border-color, #cccccc);
            border-radius: var(--radius-md, 6px);
            background-color: #ffffff;
            color: var(--text-main, #1a1a1a);
        }

        .form-group textarea {
            min-height: 70px;
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background-color: var(--primary-color, #1b4332);
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: var(--radius-md, 6px);
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover, #2d6a4f);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--card-bg, #ffffff);
            border-radius: var(--radius-lg, 8px);
            border: 1px solid var(--border-color, #e0e0e0);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--border-color, #eee);
        }

        th {
            background-color: var(--bg-color, #f8f9fa);
            color: var(--primary-color, #1b4332);
            font-weight: 700;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 12px;
            color: var(--primary-color, #1b4332);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Volver al Panel Principal</a>

    <div class="card-form">
        <h2>Planificación de Tareas</h2>

        <form id="taskForm">
            <div class="form-group">
                <label>Fecha:</label>
                <input type="date" name="fecha" required>
            </div>

            <div class="form-group">
                <label>Labor / Actividad:</label>
                <input type="text" name="labor" placeholder="Ej. Limpieza de bebederos, roza, etc." required>
            </div>

            <div class="form-group">
                <label>Personal Asignado:</label>
                <input type="text" name="personal" placeholder="Ej. Juan / Pedro">
            </div>

            <div class="form-group">
                <label>Observaciones:</label>
                <textarea name="observaciones" rows="2" placeholder="Detalles adicionales..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Guardar Tarea</button>
        </form>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Labor</th>
                    <th>Personal</th>
                    <th>Observaciones</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo">
                <tr>
                    <td colspan="5" style="text-align: center; color: #777;">No hay tareas registradas.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
