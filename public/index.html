<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12181b">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Manejo Ganadero - App de Campo</title>

  <!-- Favicon para evitar el error 404 en WebView -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐄</text></svg>">

  <!-- Telegram WebApp SDK (Única importación) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Captura detallada de errores asíncronos y depuración de promesas -->
  <script>
    window.addEventListener('unhandledrejection', function(event) {
      console.error(' [Unhandled Promise Rejection]:', event.reason);
      // Imprime el stack trace si el objeto de razón posee detalle
      if (event.reason && event.reason.stack) {
        console.error(event.reason.stack);
      }
      event.preventDefault(); 
    });

    // Inicialización inmediata del SDK de Telegram
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>

  <!-- Preconexión de fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  </script>
