<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12181b">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Manejo Ganadero - App de Campo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Captura detallada de errores asíncronos -->
  <script>
    window.addEventListener('unhandledrejection', function(event) {
      // Imprime el detalle real del objeto para identificar la causa (ej. ruta JS, Dexie, Fetch)
      console.error('Detalle de promesa rechazada:', event.reason);
      event.preventDefault(); 
    });
  </script>

  <!-- Preconexión de fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Hojas de Estilo CSS desde la raíz (./) -->
  <link rel="stylesheet" href="./variables.css">
  <link rel="stylesheet" href="./potreros.css">
  <link rel="stylesheet" href="./eventos.css">
  <link rel="stylesheet" href="./levante.css">
  <link rel="stylesheet" href="./combustible.css">
  <link rel="stylesheet" href="./planificacion.css">
  <link rel="stylesheet" href="./inventario-sanitario.css">
  <link rel="stylesheet" href="./logistica-comidas.css">
  <link rel="stylesheet" href="./historial-pastoreo.css">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Inicialización de Telegram -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    });
  </script>

  <!-- Import Map para Dexie.js -->
  <script type="importmap">
    {
      "imports": {
        "dexie": "https://unpkg.com/dexie@latest/dist/dexie.mjs"
      }
    }
  </script>
</head>
