<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hato Laguna Brava - Módulo Sanitario</title>
    <style>
        :root {
            --primary-color: #1b4332;
            --secondary-color: #2d6a4f;
            --accent-color: #52b788;
            --header-gradient: linear-gradient(135deg, #081c15 0%, #1b4332 100%);
            --card-bg: #ffffff;
            --border-color: #d8f3dc;
            --text-muted: #495057;
            --bg-body: #f4f9f4;
        }

        /* RESET Y ADAPTABILIDAD MÓVIL ABSOLUTA */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            background-color: var(--bg-body);
            color: #212529;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* CABECERA INSTITUCIONAL GANADERA */
        .main-header {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(27, 67, 50, 0.3);
            border-bottom: 3px solid var(--accent-color);
            width: 100%;
        }

        .header-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .btn-back {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }

        .btn-back:active {
            background: rgba(255, 255, 255, 0.25);
        }

        .header-title-wrapper {
            flex-grow: 1;
            text-align: center;
            padding: 0 2px;
        }

        /* Título con estilo de marca Hato Laguna Brava */
        .header-title-wrapper h1 {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .header-title-wrapper h1 span {
            color: var(--accent-color);
            font-weight: 500;
            text-transform: none;
            font-size: 0.85rem;
        }

        .header-title-wrapper p {
            font-size: 0.65rem;
            color: #a3b899;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 1px;
            text-transform: uppercase;
        }

        /* SEMÁFORO DE CONEXIÓN CLOUD */
        .sync-status-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 9px;
            border-radius: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .semaphore {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #e76f51;
        }

        .semaphore.online {
            background-color: #2a9d8f;
            box-shadow: 0 0 8px rgba(42, 157, 143, 0.9);
        }

        .sync-text {
            font-size: 0.62rem;
            color: #fff;
            font-weight: 700;
            display: none;
        }

        @media(min-width: 480px) {
            .sync-text { display: inline; }
            .header-title-wrapper h1 { font-size: 1.1rem; }
            .header-title-wrapper p { font-size: 0.72rem; }
        }

        /* CONTENEDOR PRINCIPAL FLUIDO */
        .main-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 12px 8px;
            flex-grow: 1;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            width: 100%;
        }

        @media (min-width: 1024px) {
            .menu-grid {
                grid-template-columns: 1fr 1.8fr;
                gap: 20px;
                padding: 10px;
            }
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 10px;
            padding: 14px 12px;
            box-shadow: 0 3px 10px rgba(27, 67, 50, 0.05);
            width: 100%;
        }

        .section-box h2 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 0.98rem;
            color: var(--primary-color);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 12px;
            width: 100%;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary-color);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        input, select, textarea {
            width: 100%;
            max-width: 100%;
            padding: 11px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 16px; /* Impide el zoom automático en celulares */
            color: #212529;
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select[multiple] {
            height: 140px;
            background-color: #fafafa;
            padding: 6px;
        }

        select[multiple] option {
            padding: 8px;
            border-bottom: 1px solid #eee;
            border-radius: 4px;
        }

        select[multiple] option:checked {
            background: var(--secondary-color);
            color: white;
            font-weight: 600;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        button[type="submit"] {
            display: block;
            width: 100%;
            text-align: center;
            background-color: var(--secondary-color);
            color: #ffffff;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(45, 106, 79, 0.25);
            margin-top: 8px;
            transition: background 0.2s;
        }

        button[type="submit"]:active {
            background-color: var(--primary-color);
        }

        .btn-danger {
            background-color: #e76f51;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 7px 11px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        /* TOAST DE ALERTA */
        #toast {
            visibility: hidden;
            min-width: 240px;
            background-color: #212529;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            border-left: 5px solid var(--accent-color);
            font-size: 0.82rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #toast.show { visibility: visible; }

        /* TABLA Y FILTROS */
        .toolbar-flex {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            width: 100%;
        }

        @media(min-width: 600px) {
            .toolbar-flex {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
        }

        table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.8rem;
        }

        th, td {
            padding: 10px 10px;
            border-bottom: 1px solid #dee2e6;
            color: #343a40;
            vertical-align: middle;
        }

        th {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.3px;
        }

        .badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-generalizado { background: #e0f2fe; color: #0369a1; }
        .badge-dirigido { background: #fef3c7; color: #b45309; }
        .badge-correctivo { background: #fee2e2; color: #b91c1c; }
        .badge-rutinario { background: #ecfdf5; color: #047857; }

        .help-text {
            font-size: 0.68rem;
            color: #666;
            margin-top: 4px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="toast"><span id="toast-message">Mensaje del sistema</span></div>

    <!-- CABECERA INSTITUCIONAL GANADERA -->
    <header class="main-header">
        <div class="header-container">
            <button id="btnVolverMenu" class="btn-back">← Menú</button>
            <div class="header-title-wrapper">
                <h1>Laguna Brava <span>| Sanidad Animal</span></h1>
                <p>Mantecal · Estado Apure</p>
            </div>
            <div class="sync-status-wrapper">
                <div id="syncSemaphore" class="semaphore"></div>
                <span id="syncTextLabel" class="sync-text">Cloud</span>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="main-container">
        <div class="menu-grid">
            
            <!-- FORMULARIO DE REGISTRO -->
            <div>
                <section class="section-box">
                    <h2>💉 Registro de Tratamiento</h2>
                    <form id="formSanitario">
                        <div class="form-group">
                            <label for="loteChip">Lote / Categoría / Chip *</label>
                            <input type="text" id="loteChip" required placeholder="Ej. Lote 04 - Cebú / Chip #9821">
                        </div>

                        <div class="form-group">
                            <label for="clasificacion">Clasificación del Tratamiento *</label>
                            <select id="clasificacion" required>
                                <option value="" disabled selected>Seleccione clasificación...</option>
                                <option value="Generalizado">Generalizado</option>
                                <option value="Dirigido">Dirigido</option>
                                <option value="Correctivo">Correctivo</option>
                                <option value="Rutinario">Rutinario</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="farmacosSelect">Fármaco / Producto Específico *</label>
                            <select id="farmacosSelect" multiple required>
                                <optgroup label="Desparasitantes">
                                    <option value="Abamectina">Abamectina</option>
                                    <option value="Buliver+P">Buliver+P</option>
                                    <option value="Clozaval">Clozaval</option>
                                    <option value="Comisol">Comisol</option>
                                    <option value="Overcox 5%">Overcox 5%</option>
                                    <option value="Rafocal">Rafocal</option>
                                    <option value="Ricomax">Ricomax</option>
                                    <option value="Tricalcherry">Tricalcherry</option>
                                    <option value="Vermoc 5% CO">Vermoc 5% CO</option>
                                    <option value="Zeramec">Zeramec</option>
                                </optgroup>
                                <optgroup label="Minerales y Vitaminas">
                                    <option value="Bovifos">Bovifos</option>
                                    <option value="Butafosfan">Butafosfan</option>
                                    <option value="Combecon">Combecon</option>
                                    <option value="Cuproho Plus">Cuproho Plus</option>
                                    <option value="Eritrogen">Eritrogen</option>
                                    <option value="Fosfoton">Fosfoton</option>
                                    <option value="Minerfun Plus">Minerfun Plus</option>
                                    <option value="Neocuprexan">Neocuprexan</option>
                                    <option value="Raket">Raket</option>
                                    <option value="Revimin">Revimin</option>
                                    <option value="Sigma K3">Sigma K3</option>
                                    <option value="Superceba">Superceba</option>
                                    <option value="Vitamina AD3E">Vitamina AD3E</option>
                                </optgroup>
                                <optgroup label="Antibióticos y Clínicos">
                                    <option value="Diastrept50">Diastrept50</option>
                                    <option value="Overbiotic">Overbiotic</option>
                                    <option value="Overpen">Overpen</option>
                                    <option value="Tilosina">Tilosina</option>
                                    <option value="Lepecid">Lepecid</option>
                                    <option value="Imidover">Imidover</option>
                                </optgroup>
                            </select>
                            <div class="help-text">Mantenga presionado para selección múltiple.</div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="fechaAplicacion">Aplicación *</label>
                                <input type="date" id="fechaAplicacion" required>
                            </div>
                            <div class="form-group">
                                <label for="fechaProximo">Próx. Dosis</label>
                                <input type="date" id="fechaProximo">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="observaciones">Área de Observación / Dosis</label>
                            <textarea id="observaciones" rows="2" placeholder="Dosis, vía (IM/SC)..."></textarea>
                        </div>

                        <button type="submit">💾 Guardar y Sincronizar</button>
                    </form>
                </section>
            </div>

            <!-- HISTORIAL Y REGISTROS -->
            <div>
                <section class="section-box">
                    <div class="toolbar-flex">
                        <h2>📋 Historial Sanitario</h2>
                        <input type="text" id="buscadorHistorial" placeholder="🔍 Filtrar registros..." style="width: 100%;">
                    </div>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Lote / Chip</th>
                                    <th>Clasificación</th>
                                    <th>Fármacos Aplicados</th>
                                    <th>Próx.</th>
                                    <th>Obs.</th>
                                    <th style="text-align: center;">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tablaHistorialBody">
                                <!-- Inyectado dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                    <div id="sinRegistros" style="text-align: center; padding: 25px; color: var(--text-muted); font-size: 0.85rem;">
                        No hay registros sanitarios almacenados.
                    </div>
                </section>
            </div>

        </div>
    </main>

    <!-- MOTOR DE LÓGICA FIRESTORE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {  
            getFirestore,  
            collection,  
            addDoc,  
            onSnapshot,  
            doc,  
            deleteDoc,  
            query,  
            orderBy,
            enableIndexedDbPersistence 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADbn4gV6ROrppvanBM835IRyX3U8wdAnk",
            authDomain: "hato-laguna-brava.firebaseapp.com",
            projectId: "hato-laguna-brava",
            storageBucket: "hato-laguna-brava.firebasestorage.app",
            messagingSenderId: "1053099733476",
            appId: "1:1053099733476:web:624514d41b08d1b347d7f1",
            measurementId: "G-2E517DTZFS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        try {
            enableIndexedDbPersistence(db).catch(() => {});
        } catch (e) {}

        const COLLECTION_NAME = "hato_control_sanitario";
        let registrosCache = [];

        function mostrarToast(mensaje, tipo = "success") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            if (!toast || !toastMessage) return;

            toastMessage.textContent = mensaje;
            toast.style.borderLeftColor = tipo === "error" ? "#e76f51" : "var(--accent-color)";
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const fechaInput = document.getElementById('fechaAplicacion');
            if (fechaInput) fechaInput.valueAsDate = new Date();

            document.getElementById('btnVolverMenu').addEventListener('click', () => {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = 'index.html';
                }
            });

            iniciarSincronizacion();

            document.getElementById('formSanitario').addEventListener('submit', async (e) => {
                e.preventDefault();

                const selectFarmacos = document.getElementById('farmacosSelect');
                const farmacosSeleccionados = Array.from(selectFarmacos.selectedOptions).map(opt => opt.value);

                if (farmacosSeleccionados.length === 0) {
                    mostrarToast("Seleccione al menos un fármaco", "error");
                    return;
                }

                const nuevoRegistro = {
                    loteChip: document.getElementById('loteChip').value.trim(),
                    clasificacion: document.getElementById('clasificacion').value,
                    farmacos: farmacosSeleccionados,
                    fechaAplicacion: document.getElementById('fechaAplicacion').value,
                    fechaProximo: document.getElementById('fechaProximo').value || 'No programado',
                    observaciones: document.getElementById('observaciones').value.trim() || 'Sin observaciones',
                    timestamp: Date.now()
                };

                const btnSubmit = e.target.querySelector('button[type="submit"]');
                if (btnSubmit) btnSubmit.disabled = true;

                try {
                    await addDoc(collection(db, COLLECTION_NAME), nuevoRegistro);
                    document.getElementById('formSanitario').reset();
                    if (fechaInput) fechaInput.valueAsDate = new Date();
                    mostrarToast("Tratamiento guardado y sincronizado");
                } catch (error) {
                    console.error("Error al guardar:", error);
                    mostrarToast("Error de red: No se pudo sincronizar", "error");
                } finally {
                    if (btnSubmit) btnSubmit.disabled = false;
                }
            });

            document.getElementById('buscadorHistorial').addEventListener('input', (e) => {
                renderizarTabla(e.target.value.toLowerCase());
            });
        });

        function iniciarSincronizacion() {
            const semaphore = document.getElementById('syncSemaphore');
            const syncText = document.getElementById('syncTextLabel');
            const q = query(collection(db, COLLECTION_NAME), orderBy("timestamp", "desc"));

            onSnapshot(q, (snapshot) => {
                registrosCache = [];
                snapshot.forEach((docSnap) => {
                    registrosCache.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });

                semaphore.classList.add('online');
                syncText.textContent = "Sincronizado";
                renderizarTabla();
            }, (error) => {
                console.error("Error de sincronización:", error);
                semaphore.classList.remove('online');
                syncText.textContent = "Offline";
                mostrarToast("Trabajando sin conexión a la nube", "error");
            });
        }

        window.renderizarTabla = function(filtro = '') {
            const tbody = document.getElementById('tablaHistorialBody');
            const sinRegistros = document.getElementById('sinRegistros');
            if (!tbody) return;

            const filtrados = registrosCache.filter(r => {
                const farmacosStr = Array.isArray(r.farmacos) ? r.farmacos.join(', ') : '';
                return r.loteChip.toLowerCase().includes(filtro) ||
                       farmacosStr.toLowerCase().includes(filtro) ||
                       r.clasificacion.toLowerCase().includes(filtro) ||
                       r.observaciones.toLowerCase().includes(filtro) ||
                       r.fechaAplicacion.includes(filtro);
            });

            if (filtrados.length === 0) {
                tbody.innerHTML = '';
                if (sinRegistros) sinRegistros.style.display = 'block';
                return;
            }

            if (sinRegistros) sinRegistros.style.display = 'none';

            tbody.innerHTML = filtrados.map(r => {
                let badgeClass = 'badge-rutinario';
                if (r.clasificacion === 'Generalizado') badgeClass = 'badge-generalizado';
                else if (r.clasificacion === 'Dirigido') badgeClass = 'badge-dirigido';
                else if (r.clasificacion === 'Correctivo') badgeClass = 'badge-correctivo';

                const lista = Array.isArray(r.farmacos) 
                    ? r.farmacos.map(f => `<span style="display:inline-block; background:#e9f5ed; color:#1b4332; padding:2px 5px; border-radius:4px; font-weight:600; margin:2px;">• ${f}</span>`).join('')
                    : 'N/D';

                return `
                    <tr>
                        <td><strong>${r.fechaAplicacion}</strong></td>
                        <td>${r.loteChip}</td>
                        <td><span class="badge ${badgeClass}">${r.clasificacion}</span></td>
                        <td>${lista}</td>
                        <td>${r.fechaProximo}</td>
                        <td style="max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${r.observaciones}">${r.observaciones}</td>
                        <td style="text-align: center;">
                            <button type="button" onclick="window.eliminarRegistroSanitario('${r.id}')" class="btn-danger" title="Eliminar">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        };

        window.eliminarRegistroSanitario = async function(id) {
            if (confirm("¿Está seguro de eliminar este registro sanitario?")) {
                try {
                    await deleteDoc(doc(db, COLLECTION_NAME, id));
                    mostrarToast("Registro eliminado correctamente");
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    mostrarToast("No se pudo eliminar el registro", "error");
                }
            }
        };
    </script>
</body>
</html>
