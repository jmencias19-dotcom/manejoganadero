<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Sanitario - Hato Laguna Brava</title>
    
    <!-- SDKs de Firebase (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-color: #1b4332;
            --secondary-color: #2d6a4f;
            --accent-color: #52b788;
            --header-gradient: linear-gradient(135deg, #081c15 0%, #1b4332 100%);
            --card-bg: #ffffff;
            --border-color: #d8f3dc;
            --text-muted: #495057;
            --bg-body: #f4f9f4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: #212529;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ENCABEZADO */
        .main-header {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 12px 16px;
            box-shadow: 0 4px 15px rgba(27, 67, 50, 0.2);
            border-bottom: 3px solid var(--accent-color);
            width: 100%;
        }

        .header-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .btn-back {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            transition: background 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-back:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .header-title-wrapper {
            flex-grow: 1;
            text-align: center;
        }

        .header-title-wrapper h1 {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
        }

        .header-title-wrapper h1 span {
            color: var(--accent-color);
        }

        .header-title-wrapper p {
            font-size: 0.68rem;
            color: #a3b899;
        }

        /* Semáforo de Conexión Nube */
        .sync-status-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 8px;
            border-radius: 20px;
        }

        .semaphore {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #e76f51; /* Rojo por defecto hasta conectar */
        }

        .semaphore.online {
            background-color: #2a9d8f;
            box-shadow: 0 0 6px rgba(42, 157, 143, 0.8);
        }

        .sync-text {
            font-size: 0.65rem;
            color: #fff;
            font-weight: 600;
            display: none;
        }

        @media(min-width: 600px) {
            .sync-text { display: inline; }
            .header-title-wrapper h1 { font-size: 1.15rem; }
        }

        /* CONTENEDOR PRINCIPAL */
        .main-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 12px;
            flex-grow: 1;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 1024px) {
            .menu-grid {
                grid-template-columns: 1fr 2fr;
                gap: 20px;
            }
        }

        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(27, 67, 50, 0.04);
        }

        .section-box h2 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 0.98rem;
            color: var(--primary-color);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary-color);
            margin-bottom: 3px;
        }

        input, select, textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 16px; /* Evita zoom automático en Safari/iOS */
            color: #212529;
            background-color: #fff;
        }

        select[multiple] {
            height: 120px;
            background-color: #fafafa;
        }

        select[multiple] option {
            padding: 6px;
            border-bottom: 1px solid #eee;
        }

        select[multiple] option:checked {
            background: var(--secondary-color);
            color: white;
            font-weight: 600;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button[type="submit"], .btn-main {
            display: block;
            width: 100%;
            text-align: center;
            background-color: var(--secondary-color);
            color: #ffffff;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(45, 106, 79, 0.2);
            margin-top: 6px;
        }

        button[type="submit"]:active {
            background-color: var(--primary-color);
        }

        .btn-danger {
            background-color: #e76f51;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 6px 10px;
            font-size: 0.8rem;
        }

        /* TABLA MÓVIL ADAPTABLE */
        .toolbar-flex {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        @media(min-width: 600px) {
            .toolbar-flex {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.78rem;
        }

        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #dee2e6;
            color: #343a40;
            vertical-align: middle;
        }

        th {
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
        }

        .badge {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-generalizado { background: #e0f2fe; color: #0369a1; }
        .badge-dirigido { background: #fef3c7; color: #b45309; }
        .badge-correctivo { background: #fee2e2; color: #b91c1c; }
        .badge-rutinario { background: #ecfdf5; color: #047857; }

        .help-text {
            font-size: 0.68rem;
            color: #666;
            margin-top: 3px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- CABECERA -->
    <header class="main-header">
        <div class="header-container">
            <!-- Botón Menú corregido con redirección dinámica -->
            <button id="btnVolverMenu" class="btn-back">← Menú</button>
            <div class="header-title-wrapper">
                <h1>Hato Laguna Brava <span>| Sanitario</span></h1>
                <p>Mantecal, Apure</p>
            </div>
            <div class="sync-status-wrapper">
                <div id="syncSemaphore" class="semaphore"></div>
                <span id="syncTextLabel" class="sync-text">Desconectado</span>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR -->
    <main class="main-container">
        <div class="menu-grid">
            
            <!-- FORMULARIO -->
            <div>
                <section class="section-box">
                    <h2>💉 Registrar Tratamiento</h2>
                    <form id="formSanitario">
                        <div class="form-group">
                            <label for="loteChip">Lote / Categoría / Chip *</label>
                            <input type="text" id="loteChip" required placeholder="Ej. Lote 04 - Cebú / Chip #9821">
                        </div>

                        <div class="form-group">
                            <label for="clasificacion">Clasificación *</label>
                            <select id="clasificacion" required>
                                <option value="" disabled selected>Seleccione...</option>
                                <option value="Generalizado">Generalizado</option>
                                <option value="Dirigido">Dirigido</option>
                                <option value="Correctivo">Correctivo</option>
                                <option value="Rutinario">Rutinario</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="farmacosSelect">Fármaco / Producto *</label>
                            <select id="farmacosSelect" multiple required>
                                <optgroup label="Desparasitantes">
                                    <option value="Abamectina">Abamectina</option>
                                    <option value="Buliver+P">Buliver+P</option>
                                    <option value="Clozaval">Clozaval</option>
                                    <option value="Comisol">Comisol</option>
                                    <option value="Overcox 5%">Overcox 5%</option>
                                    <option value="Rafocal">Rafocal</option>
                                    <option value="Ricomax">Ricomax</option>
                                    <option value="Tricalcherry">Tricalcherry</option>
                                    <option value="Vermoc 5% CO">Vermoc 5% CO</option>
                                    <option value="Zeramec">Zeramec</option>
                                </optgroup>
                                <optgroup label="Minerales y Vitaminas">
                                    <option value="Bovifos">Bovifos</option>
                                    <option value="Butafosfan">Butafosfan</option>
                                    <option value="Combecon">Combecon</option>
                                    <option value="Cuproho Plus">Cuproho Plus</option>
                                    <option value="Eritrogen">Eritrogen</option>
                                    <option value="Fosfoton">Fosfoton</option>
                                    <option value="Minerfun Plus">Minerfun Plus</option>
                                    <option value="Neocuprexan">Neocuprexan</option>
                                    <option value="Raket">Raket</option>
                                    <option value="Revimin">Revimin</option>
                                    <option value="Sigma K3">Sigma K3</option>
                                    <option value="Superceba">Superceba</option>
                                    <option value="Vitamina AD3E">Vitamina AD3E</option>
                                </optgroup>
                                <optgroup label="Antibióticos y otros">
                                    <option value="Diastrept50">Diastrept50</option>
                                    <option value="Overbiotic">Overbiotic</option>
                                    <option value="Overpen">Overpen</option>
                                    <option value="Tilosina">Tilosina</option>
                                    <option value="Lepecid">Lepecid</option>
                                    <option value="Imidover">Imidover</option>
                                </optgroup>
                            </select>
                            <div class="help-text">Mantén presionados varios ítems para selección múltiple.</div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="fechaAplicacion">Aplicación *</label>
                                <input type="date" id="fechaAplicacion" required>
                            </div>
                            <div class="form-group">
                                <label for="fechaProximo">Próx. Dosis</label>
                                <input type="date" id="fechaProximo">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="observaciones">Observación / Dosis</label>
                            <textarea id="observaciones" rows="2" placeholder="Dosis, vía (IM/SC)..."></textarea>
                        </div>

                        <button type="submit">💾 Guardar y Sincronizar</button>
                    </form>
                </section>
            </div>

            <!-- TABLA / HISTORIAL -->
            <div>
                <section class="section-box">
                    <div class="toolbar-flex">
                        <h2>📋 Historial Sanitario</h2>
                        <input type="text" id="buscadorHistorial" placeholder="🔍 Filtrar registros..." style="max-width: 100%;">
                    </div>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Lote / Chip</th>
                                    <th>Clasificación</th>
                                    <th>Productos</th>
                                    <th>Próx.</th>
                                    <th>Obs.</th>
                                    <th style="text-align: center;">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tablaHistorialBody">
                                <!-- Inyectado por JS -->
                            </tbody>
                        </table>
                    </div>
                    <div id="sinRegistros" style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.8rem;">
                        Cargando registros...
                    </div>
                </section>
            </div>

        </div>
    </main>

    <!-- SCRIPT DE CONEXIÓN Y LÓGICA -->
    <script>
        // Configuración de Firebase unificada con su app principal
        const firebaseConfig = {
            apiKey: "AIzaSyD-TUS-CREDENCIALES-REALES",
            authDomain: "hatolagunabrava.firebaseapp.com",
            projectId: "hatolagunabrava",
            storageBucket: "hatolagunabrava.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123:web:abc"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const COLLECTION_NAME = "hato_control_sanitario";

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('fechaAplicacion').valueAsDate = new Date();

            // 1. Corrección del botón de menú (permite volver al index o menú principal según su estructura)
            document.getElementById('btnVolverMenu').addEventListener('click', () => {
                // Intenta regresar en el historial o redirige al index general de la mini app
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = 'index.html';
                }
            });

            // 2. Cargar datos en tiempo real desde Firestore (con respaldo local offline)
            cargarDatosRemotosYLocks();

            // 3. Manejo del formulario
            document.getElementById('formSanitario').addEventListener('submit', async (e) => {
                e.preventDefault();

                const selectFarmacos = document.getElementById('farmacosSelect');
                const farmacosSeleccionados = Array.from(selectFarmacos.selectedOptions).map(opt => opt.value);

                if (farmacosSeleccionados.length === 0) {
                    alert('Seleccione al menos un fármaco.');
                    return;
                }

                const nuevoRegistro = {
                    id: 'SAN-' + Date.now(),
                    loteChip: document.getElementById('loteChip').value.trim(),
                    clasificacion: document.getElementById('clasificacion').value,
                    farmacos: farmacosSeleccionados,
                    fechaAplicacion: document.getElementById('fechaAplicacion').value,
                    fechaProximo: document.getElementById('fechaProximo').value || 'No prog.',
                    observaciones: document.getElementById('observaciones').value.trim() || 'Sin observaciones',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    // Guardar en Firestore directamente
                    await db.collection(COLLECTION_NAME).doc(nuevoRegistro.id).set(nuevoRegistro);
                    alert('¡Tratamiento sincronizado con la nube exitosamente!');
                    document.getElementById('formSanitario').reset();
                    document.getElementById('fechaAplicacion').valueAsDate = new Date();
                } catch (error) {
                    console.error("Error al sincronizar con Firebase:", error);
                    // Fallback a LocalStorage si está offline
                    let localCache = JSON.parse(localStorage.getItem(COLLECTION_NAME)) || [];
                    localCache.unshift(nuevoRegistro);
                    localStorage.setItem(COLLECTION_NAME, JSON.stringify(localCache));
                    alert('Sin conexión a la nube. Guardado localmente en el dispositivo.');
                    renderizarTabla(localCache);
                }
            });

            document.getElementById('buscadorHistorial').addEventListener('input', (e) => {
                const filtro = e.target.value.toLowerCase();
                const cached = JSON.parse(localStorage.getItem(COLLECTION_NAME)) || [];
                const filtrados = cached.filter(r => 
                    r.loteChip.toLowerCase().includes(filtro) || 
                    r.farmacos.join(', ').toLowerCase().includes(filtro) ||
                    r.clasificacion.toLowerCase().includes(filtro)
                );
                renderizarTabla(filtrados);
            });
        });

        function cargarDatosRemotosYLocks() {
            const semaphore = document.getElementById('syncSemaphore');
            const syncText = document.getElementById('syncTextLabel');

            db.collection(COLLECTION_NAME).orderBy('fechaAplicacion', 'desc').onSnapshot((snapshot) => {
                let registros = [];
                snapshot.forEach(doc => {
                    registros.push(doc.data());
                });

                // Actualizar caché local y semáforo en verde
                localStorage.setItem(COLLECTION_NAME, JSON.stringify(registros));
                renderizarTabla(registros);
                
                semaphore.classList.add('online');
                syncText.innerText = "Sincronizado";
            }, (error) => {
                console.warn("Modo offline activado:", error);
                semaphore.classList.remove('online');
                syncText.innerText = "Modo Local";
                
                // Cargar desde caché local si falla la red
                const localCache = JSON.parse(localStorage.getItem(COLLECTION_NAME)) || [];
                renderizarTabla(localCache);
            });
        }

        function renderizarTabla(registros) {
            const tbody = document.getElementById('tablaHistorialBody');
            const sinRegistros = document.getElementById('sinRegistros');

            if (!registros || registros.length === 0) {
                tbody.innerHTML = '';
                sinRegistros.style.display = 'block';
                return;
            }

            sinRegistros.style.display = 'none';
            tbody.innerHTML = registros.map(r => {
                let badgeClass = 'badge-rutinario';
                if (r.clasificacion === 'Generalizado') badgeClass = 'badge-generalizado';
                else if (r.clasificacion === 'Dirigido') badgeClass = 'badge-dirigido';
                else if (r.clasificacion === 'Correctivo') badgeClass = 'badge-correctivo';

                const lista = Array.isArray(r.farmacos) ? r.farmacos.join(', ') : r.farmacos;

                return `
                    <tr>
                        <td><strong>${r.fechaAplicacion}</strong></td>
                        <td>${r.loteChip}</td>
                        <td><span class="badge ${badgeClass}">${r.clasificacion}</span></td>
                        <td>${lista}</td>
                        <td>${r.fechaProximo}</td>
                        <td style="max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${r.observaciones}">${r.observaciones}</td>
                        <td style="text-align: center;">
                            <button onclick="eliminarRegistro('${r.id}')" class="btn-danger">🗑️</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function eliminarRegistro(id) {
            if (confirm('¿Desea eliminar este registro sanitario?')) {
                try {
                    await db.collection(COLLECTION_NAME).doc(id).delete();
                } catch (e) {
                    // Si falla la red, borra de local
                    let localCache = JSON.parse(localStorage.getItem(COLLECTION_NAME)) || [];
                    localCache = localCache.filter(r => r.id !== id);
                    localStorage.setItem(COLLECTION_NAME, JSON.stringify(localCache));
                    renderizarTabla(localCache);
                }
            }
        }
    </script>
</body>
</html>
